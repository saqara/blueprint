name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a Pages deploy in flight on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      # Runs can finish out of order: only the build of main's current HEAD may deploy,
      # so an older run finishing last can't overwrite a newer registry.
      - id: latest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Skipping deploy: $head is newer than ${{ github.sha }}"; fi
      - id: deploy
        if: steps.latest.outputs.current == 'true'
        uses: actions/deploy-pages@v4

name: ci
on:
  push: { branches: [main, v2-wip] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  # Pull requests: a new push replaces the run. Branches: every push is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
